name: StableBrowse
description: >-
  StableBrowse is a San Francisco startup (Y Combinator, Spring 2026) building
  browser infrastructure and real-world data pipelines for AI agents and AI labs.
  Its platform transforms dynamic websites into structured knowledge and
  execution graphs so agents can reliably complete web-based tasks — form
  filling, data extraction, authentication flows, and website change detection —
  without relearning workflows on every run, and it sources, labels, and enriches
  hard-to-find long-tail, gated, and ephemeral web data until it is worth
  training on. StableBrowse markets performance gains including large reductions
  in token usage, faster workflow execution, and high task success rates across
  use cases such as price monitoring, loan applications, CRM updates, travel
  booking, and navigation of legacy enterprise systems. The company was founded
  by Jay Mehta, Deepit Shah, and Somansh Shah (all formerly of Amazon). As of
  this profile the public site is a marketing landing page with no published API,
  developer documentation, or developer portal.
